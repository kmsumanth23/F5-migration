apiVersion: v1
kind: Pod
metadata:
  name: uid-write-verify
  namespace: poc-f5-new
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  containers:
  - name: shell
    image: busybox
    command: ["sh", "-c"]
    args:
    - |
      echo "=== Running as UID $(id -u), GID $(id -g) ==="
      echo "=== Existing files (should see fake-old-nginx's write) ==="
      ls -la /mnt/config/fmc/
      echo "=== Testing UID 101 read ==="
      cat /mnt/config/fmc/fhmc.conf > /dev/null && echo "READ ✅" || echo "READ ❌"
      echo "=== Testing UID 101 write ==="
      echo "# UID 101 write test $(date -Iseconds)" > /mnt/config/fmc/uid101-write-test.txt \
        && echo "WRITE ✅" || echo "WRITE ❌"
      echo "=== Files after write attempt ==="
      ls -la /mnt/config/fmc/
      sleep 60
    volumeMounts:
    - name: config
      mountPath: /mnt/config
  volumes:
  - name: config
    persistentVolumeClaim:
      claimName: poc-f5-config-pvc


---
kubectl apply -f 01c-uid-write-verify.yaml
kubectl -n poc-f5-new wait --for=condition=Ready pod/uid-write-verify --timeout=60s
kubectl -n poc-f5-new logs uid-write-verify

=== Running as UID 101, GID 101 ===
=== Existing files (should see fake-old-nginx's write) ===
-rw-r--r-- 1 101 101 329 Jul 9 08:00 fhmc.conf
=== Testing UID 101 read ===
READ ✅
=== Testing UID 101 write ===
WRITE ✅
=== Files after write attempt ===
-rw-r--r-- 1 101 101 329 Jul 9 08:00 fhmc.conf
-rw-r--r-- 1 101 101  49 Jul 9 XX:XX uid101-write-test.txt

kubectl -n poc-old-nginx exec deploy/fake-old-nginx -- ls -la /etc/nginx/custom/fmc/
# Should see uid101-write-test.txt too

# Delete the verify pod
kubectl -n poc-f5-new delete pod uid-write-verify

# Clean up test file (from either side works — both write to same EFS)
kubectl -n poc-old-nginx exec deploy/fake-old-nginx -- rm /etc/nginx/custom/fmc/uid101-write-test.txt

test before phase 4
# 1. F5 pod actually mounted the PVC at the right path
F5_POD=$(kubectl -n poc-f5-new get pod -l app.kubernetes.io/instance=f5-nginx-poc -o name | head -1)
kubectl -n poc-f5-new exec $F5_POD -- ls -la /etc/nginx/custom/fmc/

# 2. F5 hash of the file matches reference (27c61417ae9f8eea8476bf3b5665c101)
kubectl -n poc-f5-new exec $F5_POD -- md5sum /etc/nginx/custom/fmc/fhmc.conf

# 3. No CSI mount errors in pod events
kubectl -n poc-f5-new describe pod $F5_POD | grep -A5 Events


Excellent — Phase 1.5 and Phase 3 both green in one shot. This is a substantial milestone. Let me break down what you just proved before we move to Phase 4.

---

## What Phase 1.5 Proved (UID 101 verify)

```
UID 101 running as pod user:
  READ  ✅ — can read files owned by UID 101 (the seed)
  WRITE ✅ — can write new files to the shared EFS
  CROSS-VISIBLE ✅ — new file appeared instantly on fake-old-nginx side
```

The write test was actually a bonus proof point. F5 in production only needs read access to `fhmc.conf`-style includes, but seeing that writes work confirms:
- EFS access point permissions (`755` + `Uid=101,Gid=101`) are correct
- NFS lock semantics aren't blocking anything
- File visibility is bidirectional and near-instant across the two namespaces

---

## What Phase 3 Proved (F5 install)

```
F5 POC controller: f5-nginx-poc-nginx-ingress-controller-7dbdbb78d-pn4r6
Status: Running  1/1  no restarts
```

This confirms:
- Install automation v4 with `static_pv.enabled: true` executed cleanly
- The static PV creation task ran (either created new or detected existing from Phase 1b — either way, correct)
- The PVC bound to the static PV correctly
- F5 pod mounted `/etc/nginx/custom` from the shared EFS access point
- Controller passed its own health checks and reached Running state

If the mount had failed, the pod would still be `ContainerCreating` with events showing CSI errors. It's Running, so the mount is solid.

