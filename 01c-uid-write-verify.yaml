## Phase 7 — Rollback Simulation (10 min)

Final phase. Prove that if Freedom needs to roll back to the old controller, the data survives and the old side can come back cleanly.

**Re-apply the old-nginx deployment** (uses the same file you saved as `01a-old-nginx-side.yaml`):

```bash
kubectl apply -f 01a-old-nginx-side.yaml
kubectl -n poc-old-nginx wait --for=condition=Ready pod -l app=fake-old-nginx --timeout=120s
```

**Verify old side comes back and sees the same data:**

```bash
# Check the seed script skipped seeding (files already exist)
kubectl -n poc-old-nginx logs -l app=fake-old-nginx --tail=20
# Should see "=== Files already exist — skipping seed ==="

# Verify hash still matches the reference
kubectl -n poc-old-nginx exec deploy/fake-old-nginx -- md5sum /etc/nginx/custom/fmc/fhmc.conf
# Should be: 27c61417ae9f8eea8476bf3b5665c101

# Verify F5 is still fine simultaneously
kubectl -n poc-f5-new logs hash-watcher-f5 --tail=5

# One more curl to prove everything still works with both sides mounted again
curl -sk -I -H "Host: vs-test.poc-test.hxun.local" http://localhost:8080/ | head -20
```

### Success Gates

- Old-nginx pod comes up successfully
- Seed script logs "Files already exist — skipping seed" (proves data persisted)
- Hash matches the original reference
- F5-side hash-watcher still showing the same hash
- curl still returns 200 with all POC markers

