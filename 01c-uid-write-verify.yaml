## Phase 4 Setup — Prove F5 Actually Uses the File at Runtime

Assuming the three checks pass, next step is Phase 4. This is where we prove F5 doesn't just mount the file — it actually reads it and applies the directives from `fhmc.conf` when serving traffic.

**Save this as `04-test-workload.yaml`:**

```yaml
# Test backend — plain nginx pod that returns 200 on any path
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-backend
  namespace: poc-f5-new
spec:
  replicas: 1
  selector: {matchLabels: {app: test-backend}}
  template:
    metadata: {labels: {app: test-backend}}
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: poc-f5-new
spec:
  selector: {app: test-backend}
  ports: [{port: 80, targetPort: 80}]
---
# Community-style source Ingress with configuration-snippet that includes fhmc.conf
# This is what a Freedom-style Ingress looks like — we'll migrate it to F5 next
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-test-source
  namespace: poc-f5-new
  annotations:
    kubernetes.io/ingress.class: nginx-poc-source
    nginx.ingress.kubernetes.io/configuration-snippet: |
      include /etc/nginx/custom/fmc/fhmc.conf;
spec:
  ingressClassName: nginx-poc-source
  rules:
  - host: poc-test.hxun.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-backend
            port: {number: 80}
```

