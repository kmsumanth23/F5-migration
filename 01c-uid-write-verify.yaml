## Phase 5 — Concurrent Mount Soak Test

**Goal:** Prove that fake-old-nginx (simulating community NGINX) and F5 (new controller) can both mount the same EFS access point via their separate PVCs, both read the same files at the same time, and neither disrupts the other for a sustained period.

This is the critical safety proof for Freedom's real cutover window — the ~15-30 minutes when both controllers are running side-by-side before you delete the old one.

---

### Setup — Two Continuous Hash Watchers

Save this as `05-continuous-monitor.yaml`:

```yaml
apiVersion: v1
kind: Pod
metadata:
  name: hash-watcher-old
  namespace: poc-old-nginx
  labels:
    purpose: soak-test
spec:
  containers:
  - name: shell
    image: busybox
    command: ["sh", "-c"]
    args:
    - |
      while true; do
        H=$(md5sum /mnt/config/fmc/fhmc.conf 2>&1 | awk '{print $1}')
        SIZE=$(stat -c '%s' /mnt/config/fmc/fhmc.conf 2>&1)
        echo "$(date -Iseconds) OLD-SIDE hash=$H size=$SIZE"
        sleep 5
      done
    volumeMounts:
    - name: config
      mountPath: /mnt/config
      readOnly: true
  volumes:
  - name: config
    persistentVolumeClaim:
      claimName: poc-old-config-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: hash-watcher-f5
  namespace: poc-f5-new
  labels:
    purpose: soak-test
spec:
  containers:
  - name: shell
    image: busybox
    command: ["sh", "-c"]
    args:
    - |
      while true; do
        H=$(md5sum /mnt/config/fmc/fhmc.conf 2>&1 | awk '{print $1}')
        SIZE=$(stat -c '%s' /mnt/config/fmc/fhmc.conf 2>&1)
        echo "$(date -Iseconds) F5-SIDE hash=$H size=$SIZE"
        sleep 5
      done
    volumeMounts:
    - name: config
      mountPath: /mnt/config
      readOnly: true
  volumes:
  - name: config
    persistentVolumeClaim:
      claimName: poc-f5-config-pvc
```

Apply and wait for both pods:

```bash
kubectl apply -f 05-continuous-monitor.yaml
kubectl -n poc-old-nginx wait --for=condition=Ready pod/hash-watcher-old --timeout=60s
kubectl -n poc-f5-new  wait --for=condition=Ready pod/hash-watcher-f5  --timeout=60s
```

---

### Start the Soak

Run this in a `screen` or `tmux` session so it survives your terminal — this needs to run for at least 30 minutes.

**Terminal 1 — old-side watcher:**
```bash
kubectl -n poc-old-nginx logs -f hash-watcher-old
```

**Terminal 2 — F5-side watcher:**
```bash
kubectl -n poc-f5-new logs -f hash-watcher-f5
```

**Terminal 3 — continuous curl through F5 (assuming port-forward 8080→80 is still up):**
```bash
# If port-forward isn't running, restart it
# F5_POC_SVC=$(kubectl -n poc-f5-new get svc -l app.kubernetes.io/instance=f5-nginx-poc -o name | head -1)
# kubectl -n poc-f5-new port-forward $F5_POC_SVC 8080:80 &

# Continuous curl with logging
while true; do
  T=$(date -Iseconds)
  R=$(curl -sk -o /dev/null -w "status=%{http_code} time=%{time_total}s" \
    -H "Host: vs-test.poc-test.hxun.local" \
    http://localhost:8080/ 2>&1)
  MARKER=$(curl -sk -I -H "Host: vs-test.poc-test.hxun.local" \
    http://localhost:8080/ 2>&1 | grep -i x-poc-marker | tr -d '\r' || echo "MISSING")
  echo "$T $R | $MARKER"
  sleep 10
done | tee /tmp/f5-soak-test.log
```

**Terminal 4 — F5 controller log tail:**
```bash
kubectl -n poc-f5-new logs -f -l app.kubernetes.io/instance=f5-nginx-poc | grep -iE "error|warn|reload|removed|mount"
```

**Let it run 30+ minutes.** Longer is better — 60 min if you have time.

---

### Success Gates for Phase 5

At the end of the soak, all of these must hold:

1. **Hash consistency across time and both watchers** — every line in both watcher logs should show `27c61417ae9f8eea8476bf3b5665c101` (or whatever your reference hash was after removing the uid101-write-test.txt cleanup). Grep for anything else:
   ```bash
   grep -v "27c61417ae9f8eea8476bf3b5665c101" /tmp/soak-old.log /tmp/soak-f5.log 2>/dev/null || echo "No hash drift"
   ```

2. **Zero non-200 responses from curl:**
   ```bash
   grep -v "status=200" /tmp/f5-soak-test.log | grep status= || echo "All 200s"
   ```

3. **X-POC-Marker present every check:**
   ```bash
   grep -c "hxun-static-pv-poc-v1" /tmp/f5-soak-test.log
   # Should equal the number of curl iterations (roughly duration_seconds / 10)
   ```

4. **No CSI/mount errors on any watcher or F5 pod:**
   ```bash
   kubectl -n poc-old-nginx describe pod hash-watcher-old | grep -A5 Events
   kubectl -n poc-f5-new  describe pod hash-watcher-f5  | grep -A5 Events
   kubectl -n poc-f5-new  describe pod -l app.kubernetes.io/instance=f5-nginx-poc | grep -A5 Events
   ```

5. **F5 controller pod didn't restart during the soak:**
   ```bash
   kubectl -n poc-f5-new get pod -l app.kubernetes.io/instance=f5-nginx-poc
   # RESTARTS column should be 0 (or unchanged from before the soak)
   ```

---

### What This Proves

If all 5 gates pass:

- Two separate PVCs in two separate namespaces backed by the same EFS access point can coexist under sustained load
- Neither side loses its mount or sees intermittent errors
- F5 continues serving traffic reliably with the include from EFS working
- No file locking, corruption, or visibility issues between the two mount points
- The Freedom cutover window (however long it takes to route traffic away) is safe from a storage layer perspective

This is the strongest evidence we can gather short of running against actual Freedom prod.

---

### What to Do While It Runs

Since this is a soak test, you don't need to actively watch it. Set it up in `screen`/`tmux`, come back in 30-60 minutes, and check the logs. If everything's clean, we move to Phase 6 (simulated cutover — delete the fake-old-nginx and confirm F5 keeps working).

Share the summary output from the success gates when done. If anything's not clean, we investigate before proceeding.
