## What Phase 1.5 Proved (UID 101 verify)

```
UID 101 running as pod user:
  READ  ✅ — can read files owned by UID 101 (the seed)
  WRITE ✅ — can write new files to the shared EFS
  CROSS-VISIBLE ✅ — new file appeared instantly on fake-old-nginx side
```

The write test was actually a bonus proof point. F5 in production only needs read access to `fhmc.conf`-style includes, but seeing that writes work confirms:
- EFS access point permissions (`755` + `Uid=101,Gid=101`) are correct
- NFS lock semantics aren't blocking anything
- File visibility is bidirectional and near-instant across the two namespaces

