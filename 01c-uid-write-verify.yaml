**Success gate for Phase 4:**
- All three `X-POC-*` headers present in response
- Rewrite fires with 301 + correct Location header
- No include-related errors in F5 logs

If all three markers appear on the response, we've proven the complete chain end-to-end:

```
fake-old-nginx writes → EFS access point stores → F5 pod mounts → 
F5 reads at reload → configuration-snippet include fires → 
directives from fhmc.conf apply to traffic → response headers set
```

That's the exact Freedom scenario proven top to bottom.

