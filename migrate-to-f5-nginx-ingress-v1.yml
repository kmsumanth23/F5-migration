# # DEFERRED to v2 (layer on after the mapping validates on hxun):
# #   - Step 6c  curl path tests via F5 NodePort (HTTP/HTTPS) with Host header
# #   - Step 6d  F5 controller log fetch + reject/error scan -> logs/
